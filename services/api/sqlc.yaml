# sqlc.yaml
version: "2"
sql:
  - engine: "postgresql"
    queries: "../../internal/db/queries"
    schema: "../../db/migrations"
    gen:
      go:
        sql_package: "pgx/v5"
        package: "db"
        out: "../../internal/db/generated"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false